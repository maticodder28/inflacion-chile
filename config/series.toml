[[serie]]
nombre = "eee_mes"
descripcion = "Encuesta de Expectativas Económicas: inflación esperada para el mes de la encuesta (variación mensual, mediana)"
codigos = ["F089.IPC.VAR.11.M"]

[[serie]]
nombre = "eee_mes_siguiente"
descripcion = "Encuesta de Expectativas Económicas: inflación esperada para el mes siguiente (variación mensual, mediana)"
codigos = ["F089.IPC.VAR.24.M"]

[[serie]]
nombre = "eee_12m_en_11"
