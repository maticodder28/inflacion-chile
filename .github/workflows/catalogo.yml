name: catalogo

# Baja el catálogo de series del Banco Central a data/catalogo.csv y lo sube al repo.
# Se corre a mano (Actions > catalogo > Run workflow) cuando hay que buscar códigos de series.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m inflacion catalogo
        env:
          BCCH_TOKEN: ${{ secrets.BCCH_TOKEN }}
      - name: Subir el catálogo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogo.csv
          git diff --cached --quiet || git commit -m "datos: catálogo de series del Banco Central"
          git push
