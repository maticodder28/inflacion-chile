[project]
name = "inflacion-chile"
version = "0.1.0"
description = "¿Le gana un modelo a los economistas pronosticando la inflación en Chile? Datos del Banco Central de Chile."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "requests>=2.31", "matplotlib>=3.8"]

[project.optional-dependencies]
modelos = ["statsmodels>=0.14", "scikit-learn>=1.5"]
dev = ["pytest>=8", "ruff>=0.6", "nbconvert>=7", "ipykernel>=6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
